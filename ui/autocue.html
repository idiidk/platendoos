<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Auto cues</title>
<link rel="stylesheet" href="common.css">
<style>
  #app { display: flex; flex-direction: column; height: 100%; }
  #head { display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px; position: relative; }
  #name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
  #prog { color: var(--fg2); white-space: nowrap; }
  #steer { flex: 1; min-width: 120px; height: 28px; resize: none; white-space: nowrap; overflow: hidden; }
  #steer:focus { white-space: normal; overflow: auto; height: 64px; position: relative; z-index: 3; margin-bottom: -36px; }
  textarea, input[type=text], input[type=password], select { background: var(--bg2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px; font: inherit; user-select: text; -webkit-user-select: text; outline: none; }
  textarea:focus, input:focus { border-color: var(--accent); }
  button.icon { min-width: 0; padding: 5px 9px; }
  #bar { height: 2px; background: transparent; } #bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  #settings { position: absolute; right: 16px; top: 46px; z-index: 5; width: 380px; background: var(--bg3); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 14px; display: none; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #settings.open { display: block; }
  #settings .l { color: var(--fg2); margin: 8px 0 4px; } #settings > .l:first-child { margin-top: 0; }
  #settings select, #settings input[type=text], #settings input[type=password] { width: 100%; }
  #settings .r { display: flex; gap: 6px; align-items: center; } .ok { color: var(--green); flex: 1; }
  .note { color: var(--fg3); font-size: 11px; margin-top: 3px; }
  #main { flex: 1; min-height: 0; display: flex; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  #list { width: 310px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--bg2); }
  #listHead { display: flex; align-items: center; gap: 8px; padding: 6px 10px; color: var(--fg2); border-bottom: 1px solid var(--line); }
  #rows { flex: 1; overflow-y: auto; }
  .tr { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-bottom: 1px solid rgba(255,255,255,.04); }
  .tr.sel { background: #094771; } .tr.off .tt { color: var(--fg3); }
  .tr .dot { margin: 0; flex: none; }
  .tr .tx { flex: 1; min-width: 0; } .tt, .ts { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ts { color: var(--fg2); font-size: 11px; } .tr.sel .ts { color: #b9d3ea; }
  .chips { flex: none; display: flex; gap: 1px; }
  .chip { width: 6px; height: 14px; border-radius: 2px; } .chip.set { opacity: .35; } .chip.taken { box-shadow: 0 2px 0 var(--orange); }
  .dot.waiting { background: var(--fg3); } .dot.unusable { background: transparent; box-shadow: inset 0 0 0 1px var(--fg3); }
  #detail { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 12px 16px 10px; gap: 8px; overflow-y: auto; }
  #dTitle { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dSub { color: var(--fg2); }
  #empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--fg2); font-size: 14px; text-align: center; padding: 0 60px; }
  #cv { width: 100%; display: block; border-radius: 6px; background: #17181b; }
  #hint { color: var(--fg3); font-size: 11px; display: flex; gap: 14px; } #hint .sp { flex: 1; } #hover { color: var(--fg2); }
  #pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .pad { background: var(--bg2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; min-height: 74px; position: relative; }
  .pad.sel { border-color: var(--accent); background: #22303d; }
  .pad .h { display: flex; align-items: center; gap: 6px; }
  .pad .k { width: 18px; height: 18px; border-radius: 4px; color: #111; font-weight: 700; text-align: center; line-height: 18px; flex: none; }
  .pad .n { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pad .w { color: var(--fg2); font-size: 11px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .pad.none .k { opacity: .35; } .pad.none .n { color: var(--fg3); font-weight: 400; }
  .pad .b { visibility: hidden; display: flex; gap: 3px; flex: none; }
  .pad:hover .b, .pad.sel .b { visibility: visible; } .pad.none .b { display: none; }
  .pad .w b { color: var(--fg); font-weight: 500; }
  .pad .b button { min-width: 0; padding: 0; width: 22px; height: 19px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; }
  .pad .b svg { width: 10px; height: 10px; pointer-events: none; display: block; }
  .pad .b button.on { background: var(--accent); border-color: var(--accent); }
  #settings .seg { display: flex; margin-bottom: 4px; } #settings .seg button { flex: 1; padding: 4px 0; }
  .bad { color: var(--orange); }
  .tag { font-size: 10px; border-radius: 3px; padding: 0 4px; margin-left: 4px; } .tag.set { color: var(--green); background: rgba(48,209,88,.14); } .tag.taken { color: var(--orange); background: rgba(255,159,10,.14); }
  #dHead { display: flex; align-items: flex-start; gap: 12px; } #dHead > div:first-child { flex: 1; min-width: 0; }
  #tools { display: flex; gap: 4px; flex: none; }
  button.ghost { background: transparent; border-color: var(--line); color: var(--fg2); min-width: 0; padding: 3px 9px; font-size: 11px; white-space: nowrap; }
  button.ghost:hover:not(:disabled) { background: var(--bg3); color: var(--fg); } button.ghost.on { background: var(--bg3); color: var(--fg); border-color: #5a5a5e; }
  #hint .seg button { padding: 1px 9px; font-size: 11px; } #hint .seg button.on { background: #5a5a5e; color: #fff; } #hint .lbl { align-self: center; }
  #hint { align-items: center; white-space: nowrap; } #hint > span:first-child { overflow: hidden; text-overflow: ellipsis; min-width: 0; } #hint .seg { flex: none; }
  #hint .sp { flex: 1 1 0; min-width: 0; } #hover { min-width: 120px; text-align: right; }
  #src { background: var(--bg2); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  #src .r1 { display: flex; align-items: center; gap: 8px; } #src .lbl { color: var(--fg2); }
  #src .seg button { padding: 2px 12px; } #src .seg button.on { background: var(--accent); color: #fff; }
  #srcState { color: var(--fg2); font-size: 11px; } #srcState .ed { color: var(--yellow); }
  #mText { color: var(--fg2); line-height: 1.45; } #mText b { color: var(--fg); font-weight: 500; } #mText .bad { color: var(--orange); } #mText:empty { display: none; }
  #sheet { display: none; background: #17181b; border-radius: 6px; padding: 8px 10px; font: 10.5px/1.3 ui-monospace, Menlo, Consolas, monospace; white-space: pre;
    overflow: auto; max-height: 220px; color: var(--fg2); user-select: text; -webkit-user-select: text; flex: none; }
  #sheet.open { display: block; }
  #foot { display: flex; gap: 8px; align-items: center; padding: 10px 16px; }
  #foot .sp { flex: 1; } #status { color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #remove.confirm { background: #5a1d1d; border-color: var(--red); }
</style></head>
<body>
<div id="app">
  <div id="head">
    <div id="name"></div><div id="prog"></div>
    <textarea id="steer" spellcheck="false" placeholder="Your instructions for the model, e.g. “Build cues always 8 bars before the drop”"></textarea>
    <button id="steerGo" title="Ask the model again about every track with these instructions (⌘↵)">Apply</button>
    <button id="analyse" class="primary">Analyse</button>
    <button id="gear" class="icon" title="Model, key and stems">⚙</button>
    <div id="settings">
      <div class="seg" id="provider"><button data-v="openrouter">OpenRouter</button><button data-v="claude">Claude Code</button></div>
      <div class="l" id="modelLabel">Model</div>
      <select id="modelList"></select>
      <input type="text" id="modelText" spellcheck="false" placeholder="provider/model" style="display:none;margin-top:6px">
      <div id="claudeBox"><div class="l">Claude Code on this computer</div><div class="r"><span id="claudeText" style="flex:1"></span><button id="claudeAgain" title="Look for Claude Code again">Check</button></div>
        <div class="note">Uses your Claude Code login: no key, and it counts toward that plan’s usage.</div></div>
      <div id="keyBox"><div class="l">OpenRouter key</div>
      <div class="r" id="keySet"><span class="ok">✓ Stored in the keychain</span><button id="changeKey">Change</button><button id="clearKey">Remove</button></div>
      <div class="r" id="keyNew"><input type="password" id="key" autocomplete="off" placeholder="sk-or-v1-…"><button id="saveKey">Save</button></div>
      <div class="note" id="keyNote">Without a key the cues come from the built-in rules.</div></div>
      <div class="l"></div>
      <label class="check"><input type="checkbox" id="stems"> Listen to stems (drums, bass, melody, vocals)</label>
      <div class="note" id="stemsNote"></div>
      <div class="note" id="cost"></div>
    </div>
  </div>
  <div id="bar"><div></div></div>
  <div id="main">
    <div id="list">
      <div id="listHead"><input type="checkbox" id="all" title="Tick or untick every track"><span id="listInfo"></span></div>
      <div id="rows"></div>
    </div>
    <div id="detail">
      <div id="empty"></div>
      <div id="body" style="display:none;flex-direction:column;gap:8px">
        <div id="dHead"><div><div id="dTitle"></div><div id="dSub"></div></div>
          <div id="tools"><button class="ghost" id="askAgain" title="Ask the model for this track’s cues again">Ask the model again</button>
            <button class="ghost" id="reanalyse" title="Read this track’s audio and analyse it again (also asks the model again)">Analyse again</button>
            <button class="ghost" id="showSheet" title="What the model reads: this track’s arrangement as text">Sheet</button></div></div>
        <canvas id="cv"></canvas>
        <div id="hint"><span title="Click the waveform to listen from there · drag a cue to move it · double-click a cue to play it · click an empty spot in the cue lane to put the selected pad there · ⌘Z / Ctrl+Z undoes">Click to listen · drag cues · double-click a cue to play it · ⌘Z undoes</span><span class="sp"></span>
          <span id="hover"></span><span class="lbl">Snap to</span><div class="seg" id="snap" title="What dragging, placing and the arrow buttons (← →) move cues by; ⇧ moves four times as far">
          <button data-v="1">Bar</button><button data-v="0.25">Beat</button><button data-v="0.125">½ beat</button></div></div>
        <div id="pads"></div>
        <div id="src"><div class="r1"><span class="lbl">Cues from</span>
            <div class="seg" id="srcSeg"><button data-v="model">The model</button><button data-v="rules">The rules</button></div><span id="srcState"></span></div>
          <div id="mText"></div></div>
        <div id="sheet"></div>
      </div>
    </div>
  </div>
  <div id="foot"><label class="check" title="Pads that already hold another cue get the new one"><input type="checkbox" id="replace"> Replace existing cues</label>
    <span id="status"></span><span class="sp"></span>
    <button id="remove" title="Removes every hot and memory cue from the ticked tracks (Undo puts them back)">Remove cues</button><button id="undo" title="Undoes the last Write cues or Remove cues in rekordbox">Undo write</button>
    <button id="apply" class="primary">Write cues</button><button id="close">Close</button></div>
</div>
<script src="common.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); }, esc = rbm.esc;
  var NAMES = ['Intro', 'Build', 'Drop', 'Breakdown', 'Build 2', 'Drop 2', 'Outro', 'Fake drop'];
  var COL = { A: '#e8476f', B: '#58a8e6', C: '#39c6b0', D: '#b07be8', E: '#5ec26a', F: '#f0883a', G: '#4d7df0', H: '#e8c63a', M: '#8a8a90' };
  var PAL = ['#e8476f', '#58a8e6', '#e8c63a', '#5ec26a', '#b07be8', '#f0883a', '#39c6b0', '#d86bc0', '#8fb1ff', '#a8d05a', '#ff9e9e', '#6ad0e8', '#c9a26b', '#9a8cf0', '#e06d4a', '#7fd6a8'];
  var IC = function (d) { return '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>'; };
  var ICON = { play: IC('<path d="M3 1.8v8.4L10.2 6z" fill="currentColor" stroke-width="1"/>'), pause: IC('<path d="M3.6 2.2v7.6M8.4 2.2v7.6" stroke-width="2.4"/>'),
    prev: IC('<path d="M7.6 2.2L3.8 6l3.8 3.8"/>'), next: IC('<path d="M4.4 2.2L8.2 6 4.4 9.8"/>'), del: IC('<path d="M2.6 2.6l6.8 6.8M9.4 2.6L2.6 9.4"/>') };
  var S = null;        // the mod's state
  var D = null;        // the selected track in full
  var draft = {};      // its cues: slot -> bar (1-based)
  var pad = 'C';       // the pad the keys and the cue lane work on
  var snap = 1;        // what cues move by, in bars (1, a beat .25, half a beat .125)
  try { var sv = +localStorage.getItem('autocueSnap'); if (sv === 1 || sv === .25 || sv === .125) snap = sv; } catch (e) {}
  var undos = [], redos = [];  // your cue edits: {u, before, after} (slot -> position)
  var drag = null, hoverBar = 0, rowsHtml = '', steerSent = null, modelsKey = '', keyEdit = false;

  function fmt(sec) { sec = Math.max(0, sec); var m = Math.floor(sec / 60), s = Math.floor(sec % 60); return m + ':' + (s < 10 ? '0' : '') + s; }
  function send(cmd, more) { var o = more || {}; o.cmd = cmd; rbm.send(o); }

  // ---- the list ----
  function renderRows() {
    var h = '', ticked = 0, usable = 0;
    S.rows.forEach(function (r, i) {
      var chips = '';
      for (var k = 0; k < r.cues.length; k++) {
        var c = r.cues[k]; if (c === '!') continue;
        var up = c.toUpperCase();
        chips += '<i class="chip' + (c !== up ? ' set' : '') + (r.cues[k + 1] === '!' ? ' taken' : '') + '" style="background:' + COL[up] + '"></i>';
      }
      usable += r.usable; ticked += r.usable && r.tick;
      h += '<div class="tr' + (r.u === S.sel ? ' sel' : '') + (r.usable ? '' : ' off') + '" data-i="' + i + '">' +
        '<input type="checkbox"' + (r.tick ? ' checked' : '') + (r.usable ? '' : ' disabled') + '>' +
        '<span class="dot ' + r.dot + '"></span><div class="tx"><div class="tt">' + esc(r.t) + '</div><div class="ts">' + esc(r.st || r.a || '') + '</div></div>' +
        '<div class="chips">' + chips + '</div></div>';
    });
    if (h !== rowsHtml) { $('rows').innerHTML = rowsHtml = h; }
    $('all').checked = usable > 0 && ticked === usable; $('all').indeterminate = ticked > 0 && ticked < usable;
    $('listInfo').textContent = S.rows.length ? ticked + ' of ' + S.rows.length + ' tracks ticked' : '';
  }
  function select(i, scroll) {
    if (!S || i < 0 || i >= S.rows.length || S.rows[i].u === S.sel) return;
    stop();
    S.sel = S.rows[i].u; rowsHtml = ''; renderRows();
    send('select', { u: S.sel });
    if (scroll) { var el = $('rows').children[i]; if (el) el.scrollIntoView({ block: 'nearest' }); }
  }
  $('rows').addEventListener('click', function (e) {
    var tr = e.target.closest('.tr'); if (!tr) return;
    var i = +tr.dataset.i;
    if (e.target.tagName === 'INPUT') { S.rows[i].tick = e.target.checked; send('tick', { u: S.rows[i].u, on: e.target.checked }); return; }
    select(i);
  });
  $('all').onchange = function () { send('tickAll', { on: this.checked }); };

  // ---- the selected track ----
  var cv = $('cv'), g = cv.getContext('2d');
  var GUT = 50, RUL = 16, WAVE = 112, CUE = 30, LANE = 17, W = 0, H = 0;
  function dur() { var t = D.an.times; return D.an.dur || Math.max(t[t.length - 1], 1); }
  function xOf(sec) { return GUT + sec / dur() * (W - GUT - 4); }
  function tOf(pos) {  // a position in bars (1-based; 33.25 is bar 33's second beat) in seconds
    var T = D.an.times, b = Math.max(1, Math.min(D.an.bars, Math.floor(pos)));
    return T[b - 1] + Math.max(0, pos - b) * (T[b] - T[b - 1]);
  }
  function xBar(pos) { return xOf(tOf(pos)); }
  function lastPos() { return D.an.bars + 1 - Math.min(snap, .125); }
  function posAt(x, down) {  // the snap position nearest to x (down: the one at or before it)
    var t = secAt(x), T = D.an.times, b = 1;
    while (b < D.an.bars && T[b] <= t) b++;
    var p = b + Math.max(0, Math.min(1, (t - T[b - 1]) / (T[b] - T[b - 1])));
    p = (down ? Math.floor(p / snap + 1e-6) : Math.round(p / snap)) * snap;
    return Math.max(1, Math.min(down ? lastPos() : D.an.bars, p));
  }
  function posName(p) {  // "bar 33", "bar 33 · beat 2", "bar 33 · beat 2½"
    var b = Math.floor(p + 1e-6), q = Math.round((p - b) * 8), beat = Math.floor(q / 2) + 1;
    return 'bar ' + b + (q ? ' · beat ' + beat + (q % 2 ? '½' : '') : '');
  }
  function fmtAt(p) { var t = tOf(p), m = Math.floor(t / 60), sec = t - m * 60; return m + ':' + (sec < 10 ? '0' : '') + sec.toFixed(p % 1 ? 1 : 0); }
  function secAt(x) { return Math.max(0, Math.min(dur(), (x - GUT) / (W - GUT - 4) * dur())); }
  function badges() {  // the draft's cues, left to right, nudged apart where they'd overlap
    var out = Object.keys(draft).map(function (s) { return { s: s, bar: draft[s], x: xBar(draft[s]) }; });
    out.sort(function (a, b) { return a.bar - b.bar || (a.s < b.s ? -1 : 1); });
    for (var i = 0; i < out.length; i++) out[i].bx = i && out[i].x - out[i - 1].bx < 19 ? out[i - 1].bx + 19 : out[i].x;
    return out;
  }
  function laneNames() { return D.an.stems ? ['drums', 'bass', 'melody', 'vocals'] : ['highs', 'lows', 'mids']; }

  function draw() {
    if (!D || !D.an) return;
    var a = D.an, lanes = laneNames(), dpr = window.devicePixelRatio || 1;
    W = cv.clientWidth; H = RUL + WAVE + CUE + lanes.length * (LANE + 2) + 6;
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.height = H + 'px'; }
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    var top = RUL, mid = top + WAVE / 2, x0 = GUT, x1 = W - 4;
    // the loud sections, behind the waveform
    a.sections.forEach(function (s) {
      if (!s[2]) return;
      g.fillStyle = 'rgba(255,255,255,.055)';
      g.fillRect(xBar(s[0] + 1), top, xOf(a.times[Math.min(s[1], a.bars)]) - xBar(s[0] + 1), WAVE);
    });
    // the ruler: every 8 bars a tick, numbers where there's room
    g.font = '10px -apple-system, "Segoe UI", sans-serif'; g.textBaseline = 'middle';
    var step = 8, pxBar = (x1 - x0) / a.bars;
    while (step * pxBar < 34) step *= 2;
    for (var b = 1; b <= a.bars; b += 8) {
      var x = Math.round(xBar(b)) + .5, num = (b - 1) % step === 0;
      g.strokeStyle = num ? 'rgba(255,255,255,.13)' : 'rgba(255,255,255,.05)';
      g.beginPath(); g.moveTo(x, num ? RUL - 4 : top); g.lineTo(x, top + WAVE); g.stroke();
      if (num) { g.fillStyle = '#7d7d83'; g.textAlign = 'left'; g.fillText(b, x + 3, RUL / 2); }
    }
    // the waveform
    var n = a.amp.length, cw = (x1 - x0) / n;
    for (var c = 0; c < n; c++) {
      var h = Math.max(1, a.amp[c] * (WAVE / 2 - 4)), x = x0 + c * cw;
      g.fillStyle = '#1b62d8'; g.fillRect(x, mid - h, Math.max(1, cw - .3), h * 2);
      g.fillStyle = 'rgba(214,228,255,' + (.15 + .75 * a.hi[c]).toFixed(2) + ')';
      var hh = h * (.25 + .45 * a.hi[c]); g.fillRect(x, mid - hh, Math.max(1, cw - .3), hh * 2);
    }
    // what rekordbox holds now: small flags along the top
    D.existing.forEach(function (e) {
      var x = Math.round(xOf(e.ms / 1000)) + .5;
      g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.moveTo(x - 4, top); g.lineTo(x + 4, top); g.lineTo(x, top + 6); g.fill();
    });
    // the cues: a line through everything, a badge in the cue lane
    var cy = top + WAVE + 4, ly = top + WAVE + CUE;
    g.fillStyle = 'rgba(255,255,255,.03)'; g.fillRect(x0, top + WAVE + 1, x1 - x0, CUE - 2);
    g.fillStyle = '#6e6e73'; g.textAlign = 'right'; g.fillText('cues', GUT - 8, cy + 11);
    badges().forEach(function (q) {
      var x = Math.round(q.x) + .5, on = q.s === pad;
      g.strokeStyle = COL[q.s]; g.globalAlpha = on ? 1 : .75; g.lineWidth = on ? 2 : 1;
      g.beginPath(); g.moveTo(x, top); g.lineTo(x, H - 4); g.stroke(); g.lineWidth = 1; g.globalAlpha = 1;
      g.fillStyle = COL[q.s]; rr(q.bx - 1, cy, 18, 22, 4); g.fill();
      if (on) { g.strokeStyle = '#fff'; g.lineWidth = 1.5; rr(q.bx - 1, cy, 18, 22, 4); g.stroke(); g.lineWidth = 1; }
      g.fillStyle = '#111'; g.textAlign = 'center'; g.font = 'bold 12px -apple-system, "Segoe UI", sans-serif'; g.fillText(q.s, q.bx + 8, cy + 12);
      g.font = '10px -apple-system, "Segoe UI", sans-serif';
    });
    // the parts' clips: the same colour and letter is the same material again
    lanes.forEach(function (name, s) {
      var y = ly + s * (LANE + 2) + 2;
