<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Preferences</title>
<link rel="stylesheet" href="common.css">
<style>
  /* The Preferences window: the search and the areas on the left, each area's features as cards, each option a row
     with one control. What there is to show comes from the mods (core/settings.h). Narrow windows: the areas become
     tabs, rows stack. Under the areas: rekordbox's own preferences, in the same cards and rows. (The chip's own small
     window is ui/about.html.) */
  #app { display: flex; flex-direction: column; height: 100%; }
  input[type=text], input[type=search], input[type=number], select { font: inherit; color: var(--fg); background: #2a2a2c; border: 1px solid #4a4a4d;
    border-radius: 6px; padding: 4px 8px; outline: none; }
  input:focus, select:focus { border-color: var(--accent); }
  #body { flex: 1; min-height: 0; display: flex; }
  #side { width: 200px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: #1b1b1c; }
  #search { margin: 12px 10px 6px; flex: none; padding: 5px 9px; }
  #nav { flex: 1; min-height: 0; overflow: auto; padding: 4px 8px 10px; display: flex; flex-direction: column; gap: 1px; }
  #foot { flex: none; padding: 8px 10px 10px; border-top: 1px solid var(--line); }
  #foot button { width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: none; border-color: #3e3e41; color: var(--fg2); font-size: 11.5px; padding: 5px 8px; }
  #foot button:hover { color: var(--fg); border-color: #58585c; }
  #page { max-width: 720px; margin: 0 auto; }
  .phead button.rbopen { font-size: 11px; padding: 3px 10px; color: var(--fg2); background: none; border-color: #444447; margin-bottom: 2px; }
  .phead button.rbopen:hover { color: var(--fg); border-color: #5a5a5e; }
  .area { display: flex; align-items: center; gap: 9px; height: 28px; padding: 0 10px; border-radius: 6px; color: var(--fg); flex: none; }
  .area svg { width: 16px; height: 16px; flex: none; stroke: var(--fg2); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .area .t { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .area .n { color: var(--orange); font-size: 9px; }
  .area:hover:not(.sel) { background: rgba(255,255,255,.06); }
  .area.sel { background: var(--accent); color: #fff; }
  .area.sel svg { stroke: #fff; } .area.sel .n { color: rgba(255,255,255,.75); }

  #main { flex: 1; min-width: 0; overflow: auto; padding: 0 22px 26px; }
  #restart { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; margin: 0 -22px; padding: 8px 22px;
    background: #3a2c12; border-bottom: 1px solid rgba(255,159,10,.45); color: var(--orange); }
  #restart.hidden { display: none; }
  #restartText { flex: 1; min-width: 0; }
  h1 { margin: 18px 0 2px; font-size: 19px; font-weight: 650; }
  .lead { color: var(--fg2); margin: 0 0 14px; max-width: 640px; }
  .card { background: var(--bg2); border: 1px solid #333336; border-radius: 10px; margin: 0 0 12px; }
  .card.off .rows, .card.off .more, .card.off .acts { opacity: .5; }
  .chead { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px 11px; }
  .chead .txt { flex: 1; min-width: 0; }
  .chead .title { font-size: 14px; font-weight: 600; display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  .tag { font: 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--fg3); font-weight: 400; opacity: 0; transition: opacity .15s; user-select: text; -webkit-user-select: text; }
  .chead:hover .tag, .row:hover .tag { opacity: 1; }  /* (the name in the config file: for who edits it by hand) */
  .note { font-size: 11px; font-weight: 400; color: var(--fg2); }
  .note.wait { color: var(--orange); }
  .chead .blurb { color: var(--fg2); margin-top: 3px; max-width: 600px; }
  .rows { border-top: 1px solid #333336; }
  .row { display: flex; align-items: center; gap: 14px; padding: 9px 14px; border-top: 1px solid rgba(255,255,255,.05); min-height: 40px; }
  .rows > .row:first-child { border-top: 0; }
  .row .what { flex: 1; min-width: 0; }
  .row .label { color: var(--fg); }
  .row .help { color: var(--fg2); font-size: 11px; margin-top: 2px; max-width: 480px; }
  .row .ctl { flex: none; display: flex; align-items: center; gap: 8px; max-width: 62%; }
  .row .reset { color: var(--fg3); font-size: 11px; text-decoration: underline; white-space: nowrap; }
  .row .reset:hover { color: var(--fg); }
  .chg { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin: 0 0 1px 7px; }
  .rs { font-size: 11px; color: var(--fg3); margin-left: 8px; white-space: nowrap; }
  .rs.wait { color: var(--orange); }
  .unit { color: var(--fg2); font-size: 11px; min-width: 16px; }
  input[type=number] { width: 78px; text-align: right; }
  input[type=text].v { width: 190px; } input[type=text].wide { width: 280px; }
  select { max-width: 300px; }
  input[type=range] { width: 170px; accent-color: var(--accent); }
  .rangeval { min-width: 52px; text-align: right; color: var(--fg); font-variant-numeric: tabular-nums; }
  .sw { position: relative; width: 36px; height: 21px; border-radius: 11px; background: #48484b; flex: none; transition: background .12s; }
  .sw::after { content: ''; position: absolute; left: 2px; top: 2px; width: 17px; height: 17px; border-radius: 50%; background: #e6e6e6; transition: left .12s; }
  .sw.on { background: var(--accent); } .sw.on::after { left: 17px; }
  .sw.dis { opacity: .35; }
  .seg button { padding: 4px 12px; white-space: nowrap; } .seg button.on { background: var(--accent); color: #fff; }
  .more { border-top: 1px solid #333336; }
  .fold { display: flex; align-items: center; gap: 6px; padding: 8px 14px; color: var(--fg2); font-size: 11px; }
  .fold::before { content: '\25B8'; } .fold.open::before { content: '\25BE'; }
  .fold:hover { color: var(--fg); }
  .acts { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid #333336; }
  .acts button { white-space: nowrap; flex: none; }
  .acts .help { color: var(--fg2); font-size: 11px; flex: 1; }
  .status { padding: 8px 14px; border-top: 1px solid #333336; color: var(--fg2); font-size: 11px; line-height: 1.4; white-space: pre-line; }  /* settings::status: what runs now */
  h2 { font-size: 11px; font-weight: 600; color: var(--fg3); text-transform: uppercase; letter-spacing: .6px; margin: 20px 0 8px; }
  .slim .row { min-height: 44px; }
  .slim .label { font-weight: 600; }
  /* settings that share lines (a line per deck): a table */
  .decks { display: grid; gap: 8px 10px; align-items: center; padding: 10px 14px 12px; }
  .decks .h { color: var(--fg3); font-size: 11px; }
  .decks .d { font-weight: 600; white-space: nowrap; }
  .decks select { width: 100%; max-width: none; }
  .decks input[type=text] { width: 74px; } .decks input[type=number] { width: 64px; }
  .decks .g { display: flex; align-items: center; gap: 4px; }
  .decks .idle { opacity: .4; }
  .row.idle > .what .label, .row.idle > .what .help:not(.why), .row.idle > .ctl { opacity: .45; }  /* a setting whose "needs" isn't met */
  .row .help.why { color: var(--fg3); font-style: italic; }  /* a line whose first choice is "None": the rest of it does nothing yet */
  .decks + .row { border-top: 1px solid rgba(255,255,255,.05); }
  .empty { color: var(--fg3); padding: 30px 0; }
  .about { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; padding: 12px 14px; }
  .about .k { color: var(--fg2); }
  .about .v { user-select: text; -webkit-user-select: text; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px; border-top: 1px solid #333336; }
  /* rekordbox's own preferences */
  #nav .grp { flex: none; padding: 6px 10px 4px; color: var(--fg3); font-size: 10px; font-weight: 600; letter-spacing: .7px; text-transform: uppercase; }
  #nav .grp.second { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .area.openc { background: rgba(255,255,255,.07); }
  .area.pg { height: 24px; padding-left: 35px; color: var(--fg2); font-size: 11.5px; }
  .area.pg.sel { color: #fff; }
  #sub { display: none; }
  a[data-rbopen], a[data-goto] { color: var(--fg3); font-size: 11px; text-decoration: underline; text-underline-offset: 2px; }
  a[data-rbopen]:hover, a[data-goto]:hover { color: var(--fg); }
  .phead { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 4px 16px; margin: 0 0 14px; }
  .phead .t { flex: 1; min-width: 0; }
  .phead .kicker { color: var(--fg3); font-size: 11px; margin-top: 16px; }
  .phead h1 { margin: 1px 0 0; }
  .phead a { margin-bottom: 3px; }
  .rb .chead { align-items: center; padding: 10px 14px; min-height: 42px; }
  .rb .chead .ctl { flex: none; display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; max-width: 62%; }
  .rb .chead .blurb { font-size: 11px; }
  .rb .chead .title { gap: 0; }
  .rb .rows { border-top: 0; }
  .rb .chead + .rows, .crumbs + .rows { border-top: 1px solid #333336; }
  .rb .rows > .row.brk { margin-top: 7px; border-top: 1px solid #333336; }
  .rb .row { padding-top: 7px; padding-bottom: 7px; }
  .rb .row > .what { overflow-wrap: break-word; }
  .rb .row .help { line-height: 1.4; }
  .rb .row .ctl { flex: 0 1 auto; min-width: 0; max-width: 64%; flex-wrap: wrap; justify-content: flex-end; }
  .rb .row.bare > .ctl { flex: 1; max-width: 100%; }
  .rb .row.wrap { flex-wrap: wrap; }
  .rb .row.dis > .what, .rb .row.dis .inl, .rb .chead.dis .txt { opacity: .45; }
  .rb .row.lv1 { padding-left: 36px; } .rb .row.lv2 { padding-left: 58px; }
  .rb .under { flex-basis: 100%; display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 8px; }
  .rb select { min-width: 150px; max-width: 100%; text-overflow: ellipsis; }
  .rb select:disabled { opacity: .45; }
  .rb .seg button { padding: 4px 12px; }
  .rb .row .inl { color: var(--fg2); font-size: 11px; }
  .rb .pair { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
  .rb .row.pairs select { min-width: 0; width: 140px; }
  .rb .row.path > .ctl { flex-wrap: nowrap; }
  .rb .row.path select { min-width: 0; flex: 0 1 auto; }
  .rb .row.path button { flex: none; }
  .rb .row.bare.links > .ctl { justify-content: flex-start; }
  .rb .row.bare.links button.lnk { text-align: left; }
  .rb .row.pairs .pair + .pair { margin-left: 4px; }
  .rb button.lnk { background: none; border: 0; padding: 2px 0; min-width: 0; color: #5aa9ff; text-align: right; }
  .rb button.lnk:hover:not(:disabled) { background: none; text-decoration: underline; }
  .rb button.step { min-width: 24px; width: 24px; padding: 2px 0; }
  .rb .sl { display: flex; flex-direction: column; }
  .rb .sl input { width: 190px; margin: 0; }
  .rb .ends { display: flex; justify-content: space-between; gap: 8px; color: var(--fg3); font-size: 10px; margin-top: 1px; }
  .rb .rangeval { min-width: 44px; white-space: nowrap; }
  .rad { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid #77777c; flex: none; }
  .rad.on { border: 4.5px solid var(--accent); background: #fff; }
  .rad.dis { opacity: .35; }
  .rb .row.opt { gap: 10px; }
  .subh { padding: 11px 14px 3px; color: var(--fg2); font-size: 11px; font-weight: 600; border-top: 1px solid #333336; }
  .rows > .subh:first-child { border-top: 0; }
  .subh + .row, .subh + .rcols { border-top: 0 !important; }
  .subh .help { font-weight: 400; margin-top: 2px; }
  .rows > .notel { padding: 7px 14px; color: var(--fg2); font-size: 11px; line-height: 1.4; border-top: 1px solid rgba(255,255,255,.05); }
  .rows > .notel:first-child { border-top: 0; }
  p.rnote { color: var(--fg2); font-size: 11px; margin: 16px 2px 8px; }
  .rcols { display: flex; flex-wrap: wrap; border-top: 1px solid rgba(255,255,255,.05); }
  .rows > .rcols:first-child { border-top: 0; }
  .rcols > div { flex: 1 1 264px; min-width: 0; }
  .rcols > div + div { box-shadow: -1px 0 0 rgba(255,255,255,.07); }
  .rcols .row { gap: 8px; min-height: 36px; padding-top: 5px; padding-bottom: 5px; border-top: 0; }
  .rcols .row + .row { border-top: 1px solid rgba(255,255,255,.05); }
  .rcols .row > .what { flex-basis: 0; }
  .rcols .row .ctl { flex: none; max-width: 75%; flex-wrap: nowrap; }
  .rcols select { min-width: 0; width: 124px; }
  .rcols .sl input { width: 110px; }
  .colh { display: flex; justify-content: space-between; gap: 8px; padding: 6px 14px 2px; color: var(--fg3); font-size: 10.5px; }
  .q { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; margin-left: 6px; border-radius: 50%; border: 1px solid #66666b;
    color: var(--fg2); font-size: 9.5px; font-weight: 600; line-height: 1; vertical-align: 1px; flex: none; }
  .q:hover, .q.open { border-color: var(--accent); color: #fff; }
  .q.open { background: var(--accent); }
  .tiptext { color: var(--fg2); font-size: 11px; font-weight: 400; line-height: 1.45; margin-top: 4px; max-width: 520px; white-space: pre-line; user-select: text; -webkit-user-select: text; }
  .plan { display: inline-block; margin-left: 7px; padding: 0 5px; border: 1px solid rgba(255,214,10,.4); border-radius: 4px; color: var(--yellow); font-size: 9.5px; font-weight: 600; line-height: 14px; vertical-align: 1px; }
  .rb .row.out .help { margin-top: 1px; }
  .crumbs { display: flex; justify-content: flex-end; padding: 7px 14px; }
  .rb .chead a[data-goto] { white-space: nowrap; }
  @media (max-width: 700px) {
    #foot { display: none; }
    #body { flex-direction: column; }
    #side { width: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    #search { margin: 10px 10px 4px; }
    #nav { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 4px 8px 6px; }
    .area { height: 28px; }
    .area .n { display: none; }
    #main { padding: 0 12px 20px; }
    #restart { margin: 0 -12px; padding: 8px 12px; flex-wrap: wrap; }
    .row:not(.tog) { flex-wrap: wrap; }
    .row:not(.tog) .what { flex-basis: 100%; }
    .row .ctl { max-width: 100%; flex-wrap: wrap; }
    input[type=text].wide { width: 100%; }
    .decks { grid-template-columns: minmax(100px, 1fr) auto auto auto !important; }
    .decks .h { display: none; }
    .decks .d { grid-column: 1 / -1; margin-top: 6px; }
    #nav .grp, .area.pg { display: none; }
    #nav .grp.second { display: block; width: 1px; height: 18px; margin: 5px 4px 0; padding: 0; overflow: hidden; background: var(--line); }
    #sub:not(:empty) { display: flex; flex: none; gap: 2px; overflow-x: auto; padding: 5px 8px; border-bottom: 1px solid var(--line); background: #232324; }
    #sub .area.pg { display: flex; padding: 0 10px; height: 24px; }
    .rb .chead { flex-wrap: wrap; }
    .rb .chead .txt { flex-basis: 140px; }
    .rb .chead .ctl { max-width: 100%; }
    .rb .row.bare > .ctl, .rb .row.opt > .ctl { justify-content: flex-start; }
    .rb .row:not(.tog) .ctl { justify-content: flex-start; flex-basis: 100%; }
    .rb .row.opt:not(.tog) > .what { flex-basis: 0; }
    .rb .row.opt:not(.tog) > .ctl { padding-left: 25px; }
    .rb .under { justify-content: flex-start; }
    .rb button.lnk { text-align: left; }
    .rcols .row:not(.tog) > .what { flex-basis: 0; }
    .rcols .row .ctl, .rcols .row:not(.tog) .ctl { flex-basis: auto; }
  }
</style></head>
<body>
<div id="app">
  <div id="body">
    <div id="side"><input id="search" type="search" placeholder="Search"><div id="nav"></div>
      <div id="foot"><button id="rbdialog" title="rekordbox's own Preferences dialog, as rekordbox shows it">Open rekordbox's dialog…</button></div></div>
    <div id="sub"></div>
    <div id="main">
      <div id="restart" class="hidden"><span id="restartText"></span><button id="restartNow" class="primary">Restart rekordbox</button></div>
      <div id="page"></div>
    </div>
  </div>
</div>
<script src="common.js"></script>
<script>
  // Everything shown comes from the mods' own declarations, as the badge mod sends them (core/settings.h): the areas,
  // a page per mod with its settings, the lists drop-downs choose from. This page only knows how to draw a setting.
  var $ = function (id) { return document.getElementById(id); }, esc = rbm.esc;
  var state = null, area = null, filter = '', open = {}, lastHtml = '', lastSide = '';
  var ICONS = {
    decks: '<circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="1.6"/>',
    stems: '<path d="M3 13V8M6.3 13V3M9.7 13V6M13 13V10"/>',
    analysis: '<path d="M1.5 8h2l1.5-4 2.5 9 2-7 1.5 4h3.5"/>',
    spotify: '<path d="M3 5.5c3.5-1.3 7-1 10 .8M3.8 8.3c2.9-1 5.8-.7 8.2.7M4.8 11c2.1-.6 4.1-.4 5.9.5"/>',
    lists: '<path d="M2.5 4h11M2.5 8h11M2.5 12h7"/>',
    controller: '<rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M5.5 5.5v5M10.5 5.5v5M4.3 8.6h2.4M9.3 6.8h2.4"/>',
    speed: '<path d="M9 1.5 3.5 9H8l-1 5.5L12.5 7H8z"/>',
    more: '<circle cx="3.5" cy="8" r="1"/><circle cx="8" cy="8" r="1"/><circle cx="12.5" cy="8" r="1"/>',
    about: '<circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.8M8 12.4v1.8M1.8 8h1.8M12.4 8h1.8M3.6 3.6l1.3 1.3M11.1 11.1l1.3 1.3M3.6 12.4l1.3-1.3M11.1 4.9l1.3-1.3"/>'
  };
  var RB_ICONS = {  // rekordbox's categories, by its own ids
    Plan: '<rect x="1.8" y="3.5" width="12.4" height="9" rx="1.5"/><path d="M1.8 6.5h12.4M4.3 10h2.5"/>',
    Cloud: '<path d="M4.5 12.5a3 3 0 0 1-.3-6 4 4 0 0 1 7.7.8 2.6 2.6 0 0 1-.4 5.2z"/>',
    View: '<path d="M1.5 8s2.3-4.2 6.5-4.2S14.5 8 14.5 8 12.2 12.2 8 12.2 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="1.8"/>',
    Audio: '<path d="M2.5 6h2.3L8 3.2v9.6L4.8 10H2.5zM10.5 5.8a3.2 3.2 0 0 1 0 4.4M12.4 4a5.8 5.8 0 0 1 0 8"/>',
    Analysis: '<circle cx="7" cy="7" r="4.7"/><path d="m10.5 10.5 3.5 3.5M4.8 7h1l1-2 1 4 .7-2h.9"/>',
    Controller: '<circle cx="8" cy="8" r="6"/><path d="M8 8 11 5M8 12.5v.1"/>',
    Keyboard: '<rect x="1.5" y="4" width="13" height="8.5" rx="1.5"/><path d="M4 6.8h.1M6.7 6.8h.1M9.4 6.8h.1M12 6.8h.1M5 9.8h6"/>',
    Detail: '<path d="M2 5h6.5M11.8 5H14M2 11h2.2M7.5 11H14"/><circle cx="10.2" cy="5" r="1.6"/><circle cx="5.8" cy="11" r="1.6"/>',
    DVS: '<circle cx="7" cy="9" r="5.2"/><circle cx="7" cy="9" r="1.2"/><path d="M14 2v5l-2.8 3"/>',
    Extensions: '<rect x="2" y="2.5" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="8.8" y="9" width="5" height="5" rx="1"/><path d="M11.3 2.5v5M8.8 5h5"/>'
  };

  // ---- what there is --------------------------------------------------------------------------------------------
  // The areas with their pages (mods); a mod that names no area, or one this window doesn't know: "More". Last:
  // General (the area "about": settings of no one mod, the chip, the log and the config file).
  function areas() {
    var known = {}, list = state.areas.map(function (a) {
      known[a.id] = 1;
      return { id: a.id, title: a.title, blurb: a.blurb, icon: a.icon, pages: state.pages.filter(function (p) { return p.area === a.id; }) };
    }).filter(function (a) { return a.pages.length; });
    var rest = state.pages.filter(function (p) { return !known[p.area] && p.area !== 'about'; });
    if (rest.length) list.push({ id: 'more', title: 'More', blurb: 'Mods that name no area.', pages: rest });
    list.push({ id: 'about', title: 'General', blurb: '', pages: [] });
    return list;
  }
  function matches(p, o) {
    if (!filter) return true;
    var t = (p.title + ' ' + p.about + ' ' + p.mod).toLowerCase();
    if (!o) return t.indexOf(filter) >= 0 || p.settings.some(function (x) { return matches(p, x); });
    return (o.label + ' ' + o.help + ' ' + o.key + ' ' + (o.line || '')).toLowerCase().indexOf(filter) >= 0 || t.indexOf(filter) >= 0;
  }

  // ---- rekordbox's own preferences (state.rb) --------------------------------------------------------------------
  // The native side sends each section of a Preferences page as its controls, flat, placed in rekordbox's own pixels.
  // The rules here read captions, groups and nesting from those positions; none of them knows a setting by name.

    var lives = (only ? [] : p.live || []).map(function (l) {  // switches whose state lives in the mod (settings::liveSwitch)
      return '<div class="row tog' + (l.why ? ' idle' : '') + '"><div class="what"><div class="label">' + esc(l.label) + '</div>' +
        (l.help ? '<div class="help">' + esc(l.help) + '</div>' : '') + (l.why ? '<div class="help why">' + esc(l.why) + '</div>' : '') + '</div>' +
        '<div class="ctl"><div class="sw' + (l.on ? ' on' : '') + (l.why ? ' dis' : '') + '" data-live="' + esc(l.id) + '"></div></div></div>';
    }).join('');
    var acts = (only ? [] : p.actions).map(function (a) {
      return '<div class="acts"><button data-act="' + esc(a.id) + '">' + esc(a.label) + '</button><span class="help">' + esc(a.help || '') + '</span></div>';
    }).join('');
    return '<div class="card' + (p.on ? '' : ' off') + '"><div class="chead"><div class="txt"><div class="title">' + esc(p.title) +
      stateNote(p) + '<span class="tag">' + esc(p.mod) + '</span></div><div class="blurb">' + esc(p.about) + '</div></div>' + modSwitch(p) + '</div>' +
      (grid.length || main.length || lives ? '<div class="rows">' + (grid.length ? table(grid) : '') + main.map(row).join('') + lives + '</div>' : '') +
      (p.status && !only ? '<div class="status">' + esc(p.status) + '</div>' : '') + acts +
      fold(':adv', 'More options', adv) + fold(':dbg', 'Fault-finding', dbg) + '</div>';
  }
  function slim(p) {
    return '<div class="row tog"><div class="what"><div class="label">' + esc(p.title) + ' ' + stateNote(p) + ' <span class="tag">' + esc(p.mod) + '</span></div>' +
      '<div class="help">' + esc(p.about) + '</div></div><div class="ctl">' + modSwitch(p) + '</div></div>';
  }
  // A mod that belongs with one of rekordbox's pages (Mod::rekordboxPage, "Audio/Configuration"): its card is shown
  // there, under rekordbox's own settings, and its area has a line that leads to it. Without that page here (prefs
  // off): in its area as any other.
  function rbHome(p) {
    if (!p.rb) return null;
    var cut = p.rb.indexOf('/'), cat = cut < 0 ? p.rb : p.rb.slice(0, cut), page = cut < 0 ? null : p.rb.slice(cut + 1);
    return rbFind(cat, page) || (page !== null ? rbFind(cat, null) : null);
  }
  function homeLine(p, f) {
    return '<div class="row"><div class="what"><div class="label">' + esc(p.title) + ' ' + stateNote(p) + ' <span class="tag">' + esc(p.mod) + '</span></div>' +
      '<div class="help">' + esc(p.about) + '</div></div><div class="ctl"><a data-goto="' + esc(f.cat.id) + '" data-page="' + esc(f.page.id) + '">' +
      esc('In ' + crumbText(f).replace(/^rekordbox · /, 'rekordbox › ').replace(/ · /g, ' › ')) + '</a></div></div>';
  }
  function areaHtml(a) {
    var away = filter ? [] : a.pages.filter(function (p) { return rbHome(p); });
    var pages = a.pages.filter(function (p) { return matches(p) && away.indexOf(p) < 0; });
    var withOpts = pages.filter(function (p) { return p.settings.length || p.actions.length; });
    var without = pages.filter(function (p) { return withOpts.indexOf(p) < 0; });
    return withOpts.map(function (p) { return card(p); }).join('') +  // (not map(card): card's second argument)
      (without.length ? (withOpts.length && !filter ? '<h2>Nothing to set: just on or off</h2>' : '') + '<div class="card slim"><div class="rows">' + without.map(slim).join('') + '</div></div>' : '') +
      (away.length ? '<h2>With rekordbox\'s own settings</h2><div class="card slim"><div class="rows">' + away.map(function (p) { return homeLine(p, rbHome(p)); }).join('') + '</div></div>' : '');
  }
  function aboutHtml() {
    var own = state.pages.filter(function (p) { return p.area === 'about'; });
    return '<h1>General</h1><p class="lead">What belongs to no one feature. Everything in this window is saved as you change it: ' +
      'settings apply within a few seconds; a feature\'s own switch, and settings that say so, after a restart of rekordbox.</p>' +
      (state.about.length || own.length ? '<div class="card"><div class="rows">' + state.about.map(row).join('') + own.map(slim).join('') + '</div></div>' : '') +
      '<div class="card"><div class="about"><span class="k">Versions</span><span class="v">' + esc(state.versions) + '</span>' +
      '<span class="k">Mods</span><span class="v">' + esc(state.summary) + '</span></div>' +
      '<div class="btns"><button data-cmd="log">Open log</button><button data-cmd="config">Open config file</button><button data-cmd="restart">Restart rekordbox</button></div></div>';
  }
  function pageHtml() {
    var list = areas();
    if (filter) {
      var hits = list.map(function (a) { return a.id === 'about' ? '' : areaHtml(a); }).join('');
      var about = state.about.filter(function (o) { return matches({ title: 'About', about: '', mod: '', settings: [] }, o); });
      var own = hits + (about.length ? '<div class="card"><div class="rows">' + about.map(row).join('') + '</div></div>' : ''), theirs = rbSearchHtml();
      return '<h1>Search</h1><p class="lead">Everything that mentions “' + esc(filter) + '”.</p>' +
        (own + theirs ? own + (theirs ? '<h2>rekordbox\'s preferences</h2>' + theirs : '') : '<div class="empty">Nothing found.</div>');
    }
    if (area === 'rb') {
      var f = rbFind(rbCat, rbPage) || rbFind(rbCat, null);
      if (f) { rbPage = f.page.id; return rbPageHtml(f); }
      area = null;  // (no longer there)
    }
    var cur = null;
    if (!area) { firstPage(); if (area === 'rb') return pageHtml(); }
    list.forEach(function (a) { if (a.id === area) cur = a; });
    if (!cur) cur = list[0], area = cur.id;
    if (cur.id === 'about') return aboutHtml();
    return '<h1>' + esc(cur.title) + '</h1><p class="lead">' + esc(cur.blurb) + '</p>' + areaHtml(cur);
  }
  function navHtml(cls, attrs, icon, title, tail) {
    return '<div class="area' + cls + '"' + attrs + '>' + (icon ? '<svg viewBox="0 0 16 16">' + icon + '</svg>' : '') + '<span class="t">' + esc(title) + '</span>' + (tail || '') + '</div>';
  }
  function rbNav(c, p, cls) {
    var sel = !filter && area === 'rb' && rbCat === c.id && rbPage === p.id;
    return navHtml(' pg' + (sel ? ' sel' : '') + (cls || ''), ' data-nav="' + esc(c.id) + '" data-page="' + esc(p.id) + '"', '', p.title);
  }
  // Where the window opens: rekordbox's first category with settings of its own to show (not Plan, which is
  // rekordbox's dialog only), else the first area of the mods.
  var autoArea = false;
  function firstPage() {
    try {  // (where this window was last: a convenience of this computer's)
      var was = JSON.parse(localStorage.getItem('prefs.at') || 'null');
      if (was && was.area === 'rb' && rbFind(was.cat, was.page)) { area = 'rb'; rbCat = was.cat; rbPage = was.page; return; }
      if (was && was.area && was.area !== 'rb' && areas().some(function (a) { return a.id === was.area; })) { area = was.area; return; }
    } catch (e) {}
    var shows = function (c) { return c.pages.some(function (p) { return p.rows.some(function (r) { return r.items.some(function (i) { return /toggle|combo|slider/.test(i.k); }); }); }); };
    var c = rbCats().filter(shows)[0];
    autoArea = !c;  // (rekordbox's pages may come a moment later: then they are where it opens)
    if (c) { area = 'rb'; rbCat = c.id; rbPage = c.pages[0].id; } else area = areas()[0].id;
  }
  function sideHtml() {
    var list = areas(), cats = rbCats();
    if (!area) firstPage();
    var own = list.map(function (a) {  // (an orange dot: something here waits for a restart)
      var wait = false, sets = a.id === 'about' ? state.about : [];
      if (a.id === 'about') state.pages.forEach(function (p) { if (p.area === 'about') a.pages = a.pages.concat(p); });
      a.pages.forEach(function (p) { if (p.state === 'pending') wait = true; sets = sets.concat(p.settings); });
      sets.forEach(function (o) { if (o.pending) wait = true; });
      return navHtml(!filter && a.id === area ? ' sel' : '', ' data-area="' + esc(a.id) + '"', a.icon || ICONS[a.id] || ICONS.more, a.title,
        wait ? '<span class="n" title="Something here waits for a restart">●</span>' : '');
    });
    var theirs = cats.map(function (c) {
      var here = !filter && area === 'rb' && rbCat === c.id, many = c.pages.length > 1;
      return navHtml(here ? (many ? ' openc' : ' sel') : '', ' data-nav="' + esc(c.id) + '"', RB_ICONS[c.id] || ICONS.more, catTitle(c)) +
        (here && many ? c.pages.map(function (p) { return rbNav(c, p); }).join('') : '');
    }).join('');
    // rekordbox's own first: what most people come for; then the mods'
    return (cats.length ? '<div class="grp">rekordbox</div>' + theirs + '<div class="grp second">platendoos</div>' : '') + own.join('');
  }
  function subHtml() {  // narrow windows: the chosen category's pages, a second strip
    var h = '';
    rbCats().forEach(function (c) { if (!filter && area === 'rb' && c.id === rbCat && c.pages.length > 1) h = c.pages.map(function (p) { return rbNav(c, p); }).join(''); });
    return h;
  }
  // Keep the chosen category and page of the sidebar (or strip) in sight.
  function reveal(box) {
    [box.querySelector('.area.openc'), box.querySelector('.area.sel')].forEach(function (el) {
      if (!el || !el.offsetWidth) return;  // (a strip hides what is shown elsewhere)
      var a = el.getBoundingClientRect(), b = box.getBoundingClientRect();
      if (a.right > b.right) box.scrollLeft += a.right - b.right + 8; else if (a.left < b.left) box.scrollLeft -= b.left - a.left + 8;
      if (a.bottom > b.bottom) box.scrollTop += a.bottom - b.bottom + 8; else if (a.top < b.top) box.scrollTop -= b.top - a.top + 8;
    });
  }
  function render(force) {
    if (!state) return;
    if (area === 'rb' && !rbFind(rbCat, rbPage) && !rbFind(rbCat, null)) area = null;
    var side = sideHtml(), sub = subHtml();
    if (side + sub !== lastSide) $('nav').innerHTML = side, $('sub').innerHTML = sub, lastSide = side + sub, reveal($('nav')), reveal($('sub'));
    // A rekordbox page that comes into view: the native side reads its values afresh.
    if (area === 'rb' && !filter) { var f = rbFind(rbCat, rbPage) || rbFind(rbCat, null); rbShow(f.cat.id, f.page.id); }
    // While a field has the focus the page is left alone: a refresh must not take what is being typed or dragged.
    // A drop-down only counts while its list may be open (it keeps the focus after it closed without a choice, which
    // used to freeze the page until a click elsewhere); a slider while it is held, focused or not (WebKit takes the
    // focus off a range input as the mouse goes down on it, so a page made anew ended the drag at once).
    var f = document.activeElement, busy = (dragging && Date.now() - dragAt < 10000) || (f && $('page').contains(f) &&
      (f.tagName === 'SELECT' ? Date.now() - selectAt < 8000 : f.type !== 'range' && f.tagName === 'INPUT'));
    var html = pageHtml();
    try { localStorage.setItem('prefs.at', JSON.stringify({ area: area, cat: rbCat, page: rbPage })); } catch (e) {}
    if (html === lastHtml || (busy && !force)) return;
    $('page').innerHTML = html, lastHtml = html;
  }
  var selectAt = 0, dragging = false, dragAt = 0;  // (a lost pointerup doesn't keep the page still for long)
  function narrow() { return window.innerWidth <= 700; }
  var wasNarrow = narrow();
  window.addEventListener('resize', function () {
    reveal($('nav')); reveal($('sub'));
    if (narrow() !== wasNarrow) wasNarrow = narrow(), render();  // (the choices that depend on the room)
  });
  rbm.onState = function (s) {
    state = s;
    $('restartText').textContent = s.restart || '';
    $('restart').classList.toggle('hidden', !s.restart);
    if (!s.restart || !s.playing) armed = false;
    restartLabel();
    $('foot').style.display = rbCats().length ? '' : 'none';  // (rekordbox's pages aren't here: prefs off)
    if (autoArea && rbCats().length) firstPage();
    render();
    // rekordbox's Preferences command opened the window (prefs): its category, once rekordbox's part is there
    if (s.go && s.go.n !== wentGo && s.rb) {
      wentGo = s.go.n;
      rbGo(s.go.cat, rbFind(s.go.cat, s.go.page) ? s.go.page : null);
      rbm.send({ cmd: 'went', n: s.go.n });
    }
  };
  var wentGo = 0;

  // ---- what the page sends ------------------------------------------------------------------------------------
  function option(key) {
    var found = null;
    state.about.forEach(function (o) { if (o.key === key) found = o; });
    state.pages.forEach(function (p) { p.settings.forEach(function (o) { if (o.key === key) found = o; }); });
    return found;
  }
  function setValue(key, value) { rbm.send({ cmd: 'set', key: key, value: String(value).trim() }); }
  var armed = false, restarting = false;
  function restartLabel() {
    $('restartNow').textContent = restarting ? 'Restarting…' : armed ? 'A deck is playing: restart anyway' : 'Restart rekordbox';
    $('restartNow').disabled = restarting;
  }
  function restart() {  // while a deck plays it asks once more first: the music stops
    if (state && state.playing && !armed) { armed = true; restartLabel(); $('restart').classList.remove('hidden'); $('restartText').textContent = $('restartText').textContent || 'A deck is playing.'; return; }
    restarting = true; restartLabel();
    rbm.send({ cmd: 'restart' });
    setTimeout(function () { restarting = false; armed = false; restartLabel(); }, 15000);  // (rekordbox asked something, or didn't quit)
  }
  $('restartNow').onclick = restart;
  $('rbdialog').onclick = function () {  // at the rekordbox page shown last (or the first one)
    var f = rbFind(rbCat, rbPage) || rbFind(rbCat, null) || (rbCats()[0] && rbFind(rbCats()[0].id, null));
    if (f) rbm.send({ cmd: 'rb', op: 'open', cat: f.cat.id, page: f.page.id });
  };
  $('nav').onclick = $('sub').onclick = function (e) {
    var a = e.target.closest('.area');
    if (!a) return;
    if (a.dataset.nav !== undefined) { rbGo(a.dataset.nav, a.dataset.page === undefined ? null : a.dataset.page); return; }
    area = a.dataset.area; filter = ''; $('search').value = ''; autoArea = false;
    render(true); $('main').scrollTop = 0;
  };
  $('page').addEventListener('click', function (e) {
    var t = e.target, b;
    if (rbClick(e)) return;
    if (t.dataset.fold) { open[t.dataset.fold] = !t.classList.contains('open'); render(true); return; }
    if (t.dataset.reset) { if (document.activeElement) document.activeElement.blur(); rbm.send({ cmd: 'unset', key: t.dataset.reset }); return; }
    if (t.dataset.mod) { if (!t.classList.contains('dis')) rbm.send({ cmd: 'mod', key: t.dataset.mod, value: !t.classList.contains('on') }); return; }
    if (t.dataset.act) { rbm.send({ cmd: 'action', id: t.dataset.act }); return; }
    if (t.dataset.live) { if (!t.classList.contains('dis')) t.classList.toggle('on'), rbm.send({ cmd: 'live', id: t.dataset.live, on: t.classList.contains('on') }); return; }
    if (t.dataset.cmd) { if (t.dataset.cmd === 'restart') restart(); else rbm.send({ cmd: t.dataset.cmd }); return; }
    if (t.classList.contains('sw') && t.dataset.k) { setValue(t.dataset.k, t.classList.contains('on') ? '0' : '1'); return; }
    if ((b = t.closest('.seg button'))) setValue(b.parentNode.dataset.k, b.dataset.v);
  });
  $('page').addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset.rb) {  // (a value rekordbox words itself, "128 samples", changes once it has answered)
      var out = t.closest('.ctl, .under').querySelector('.rangeval');
      if (out && !out.dataset.fixed) rbItems(t.closest('[data-cat]').dataset.cat, t.closest('[data-cat]').dataset.page).forEach(function (i) { if (i.p === t.dataset.p) out.textContent = fmt(i, +t.value); });
      return;
    }
    if (t.type === 'range') {
      dragAt = Date.now();
      var o = option(t.dataset.k) || {};
      t.nextElementSibling.textContent = t.value + (o.unit ? ' ' + o.unit : '');
      // The value goes out while the slider moves (a few times a second), so what it sets follows the hand: the
      // metronome of outputsync's Fine-tune, not only where it was let go.
      if (t.dataset.k) {
        var key = t.dataset.k, v = t.value;
        sliderNext = { key: key, v: v };
        if (!sliderTimer) sliderSend();
      }
    }
  });
  var sliderNext = null, sliderTimer = 0, sliderSent = {};
  function sliderSend() {
    sliderTimer = 0;
    if (!sliderNext) return;
    if (sliderSent[sliderNext.key] !== sliderNext.v) setValue(sliderNext.key, sliderNext.v), sliderSent[sliderNext.key] = sliderNext.v;
    sliderNext = null;
    sliderTimer = setTimeout(sliderSend, 80);
  }
  $('page').addEventListener('change', function (e) {
    var t = e.target;
    if (t.type === 'range') dragging = false;
    if (t.dataset && t.dataset.rb) { rbChange(t); return; }
    if (!t.dataset || !t.dataset.k) return;
    var v = t.value;
    if (t.type === 'number') {
      if (v === '' || isNaN(+v)) { render(true); return; }
      if (t.min !== '' && +v < +t.min) v = t.min;
      if (t.max !== '' && +v > +t.max) v = t.max;
    }
    if (t.type === 'range') { sliderNext = null; if (sliderSent[t.dataset.k] === v) { t.blur(); return; } sliderSent[t.dataset.k] = v; }
    setValue(t.dataset.k, v);
    if (t.tagName === 'SELECT' || t.type === 'range') t.blur();
  });
  $('page').addEventListener('pointerdown', function (e) {
    var t = e.target;
    if (t.tagName === 'SELECT') selectAt = Date.now();
    if (t.type === 'range') dragging = true, dragAt = Date.now(), t.focus();  // (no refresh while dragging)
  });
  window.addEventListener('pointerup', function (e) {  // (released where it was: no change event)
    var t = e.target;
    if (!dragging) return;
    dragging = false;
    if (t && t.type === 'range') setTimeout(function () { t.blur(); }, 50);
    else setTimeout(render, 0);
  });
  $('page').addEventListener('keydown', function (e) { if (e.target.tagName === 'SELECT') selectAt = Date.now(); }, true);
  $('page').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.target.blur();
    if (e.key === 'Escape' && /INPUT|SELECT/.test(e.target.tagName)) { e.stopPropagation(); e.target.blur(); render(true); }
  });
  $('page').addEventListener('focusout', function () { selectAt = 0; setTimeout(render, 0); });
  $('search').addEventListener('input', function () { filter = this.value.trim().toLowerCase(); render(true); $('main').scrollTop = 0; });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if ($('search').value) { $('search').value = ''; filter = ''; render(true); } else rbm.send({ cmd: 'close' });
  });
  rbm.ready();
</script>
</body></html>
