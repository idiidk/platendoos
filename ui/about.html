<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>platendoos</title>
<link rel="stylesheet" href="common.css">
<style>
  /* The chip's own small window: what runs, what waits for a restart, and the way to the Preferences window
     (ui/settings.html), where everything is set. Sent by mods/badge.cpp. */
  body { user-select: none; -webkit-user-select: none; }
  #app { display: flex; flex-direction: column; align-items: center; height: 100%; box-sizing: border-box; padding: 26px 24px 16px; text-align: center; }
  .logo { width: 64px; height: 64px; border-radius: 15px; background: linear-gradient(160deg, #3d8bff, #1f63d6); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(10,132,255,.25), inset 0 1px 0 rgba(255,255,255,.18); flex: none; }
  .name { margin-top: 14px; font-weight: 700; font-size: 17px; letter-spacing: 2px; color: #ececec; }
  .tagline { margin-top: 3px; color: var(--fg2); font-size: 12px; }
  .vers { margin-top: 16px; display: grid; grid-template-columns: auto auto; gap: 3px 12px; font-size: 11.5px; justify-content: center; text-align: left; }
  .vers .k { color: var(--fg3); text-align: right; }
  .vers .v { color: var(--fg); user-select: text; -webkit-user-select: text; font-variant-numeric: tabular-nums; }
  .sum { margin-top: 12px; color: var(--fg2); font-size: 12px; }
  .sum .dot { margin-right: 6px; }
  .warn { margin-top: 6px; color: var(--orange); font-size: 11.5px; }
  .wait { margin-top: 14px; width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid rgba(255,159,10,.45); background: #3a2c12; border-radius: 8px;
    color: var(--orange); font-size: 11.5px; text-align: left; display: flex; flex-direction: column; gap: 8px; }
  .wait button { align-self: flex-end; }
  .hidden { display: none !important; }
  .grow { flex: 1; min-height: 12px; }
  #prefs { width: 100%; height: 32px; font-size: 13px; font-weight: 500; }
  .links { margin-top: 12px; display: flex; gap: 18px; justify-content: center; }
  .links a { color: var(--fg3); font-size: 11.5px; text-decoration: none; cursor: default; }
  .links a:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 2px; }
</style></head>
<body>
<div id="app">
  <div class="logo"><svg width="44" height="44" viewBox="0 0 40 40" fill="none" stroke="#fff">
    <circle cx="20" cy="20" r="12.4" stroke-width="3"/><circle cx="20" cy="20" r="6.8" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="2.5" fill="#fff" stroke="none"/></svg></div>
  <div class="name">PLATENDOOS</div>
  <div class="tagline">mods for rekordbox</div>
  <div class="vers">
    <span class="k">platendoos</span><span class="v" id="pd"></span>
    <span class="k">rekordbox</span><span class="v" id="rb"></span>
    <span class="k">edition</span><span class="v" id="ed"></span>
  </div>
  <div class="sum"><span class="dot done" id="dot"></span><span id="sum"></span></div>
  <div class="warn hidden" id="warn"></div>
  <div class="wait hidden" id="wait"><span id="waitText"></span><button id="restart" class="primary">Restart rekordbox</button></div>
  <div class="grow"></div>
  <button id="prefs" class="primary">Preferences…</button>
  <div class="links"><a data-cmd="log">Open log</a><a data-cmd="config">Open config file</a></div>
</div>
<script src="common.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); }, state = null, armed = false, restarting = false;
  function restartLabel() {
    $('restart').textContent = restarting ? 'Restarting…' : armed ? 'A deck is playing: restart anyway' : 'Restart rekordbox';
    $('restart').disabled = restarting;
  }
  rbm.onState = function (s) {
    state = s;
    $('pd').textContent = s.platendoos; $('rb').textContent = s.rekordbox; $('ed').textContent = s.edition;
    $('sum').textContent = s.summary;
    $('dot').className = 'dot ' + (s.on ? 'done' : '');
    $('warn').textContent = s.warn || ''; $('warn').classList.toggle('hidden', !s.warn);
    $('waitText').textContent = s.restart || ''; $('wait').classList.toggle('hidden', !s.restart);
    if (!s.restart || !s.playing) armed = false;
    restartLabel();
  };
  $('restart').onclick = function () {  // while a deck plays it asks once more first: the music stops
    if (state && state.playing && !armed) { armed = true; restartLabel(); return; }
    restarting = true; restartLabel();
    rbm.send({ cmd: 'restart' });
    setTimeout(function () { restarting = false; armed = false; restartLabel(); }, 15000);
  };
  $('prefs').onclick = function () { rbm.send({ cmd: 'prefs' }); };
  document.addEventListener('click', function (e) { var c = e.target.dataset && e.target.dataset.cmd; if (c) rbm.send({ cmd: c }); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') rbm.send({ cmd: 'close' });
    if (e.key === 'Enter' || (e.key === ',' && (e.metaKey || e.ctrlKey))) rbm.send({ cmd: 'prefs' });
  });
  rbm.ready();
</script>
</body></html>
