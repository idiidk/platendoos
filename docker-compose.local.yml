# For running the docs site on this computer: http://localhost:8080/
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
# (Coolify uses docker-compose.yml alone: its proxy reaches the container, no host port needed.)
services:
  docs:
    ports:
      - 127.0.0.1:${DOCS_HOST_PORT:-8080}:${PORT:-8080}
